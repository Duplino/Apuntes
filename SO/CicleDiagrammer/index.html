<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CPU Cycle Diagrammer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    body { background: #f0f2f5; }

    /* ── Shared table wrapper ─────────────────────────────────────── */
    .tbl-wrap { overflow-x: auto; }

    /* ── Main combined table ──────────────────────────────────────── */
    table.main-tbl { border-collapse: collapse; table-layout: fixed; }
    table.main-tbl th,
    table.main-tbl td { border: 1px solid #ced4da; }

    /* Name / label column — sticky left */
    .col-name {
      width: 90px; min-width: 90px;
      font-weight: 600; text-align: center; vertical-align: middle;
      background: #f8f9fa;
      position: sticky; left: 0; z-index: 2;
      padding: 4px 6px; font-size: .8rem;
      border-right: 2px solid #adb5bd;
    }

    /* Instant ruler header — number sits at the LEFT edge (= the instant line) */
    th.col-instant {
      width: 48px; min-width: 48px;
      padding: 2px 0 3px 3px;
      text-align: left; vertical-align: bottom;
      font-size: .72rem; font-weight: 700; color: #495057;
      background: #fff;
      border-bottom: 2px solid #6c757d;
    }

    /* Data cells */
    td.cell {
      width: 48px; min-width: 48px; height: 44px;
      padding: 0; cursor: pointer; position: relative;
      overflow: visible; user-select: none;
    }
    td.cell:hover { background: rgba(0,0,0,.03); }

    /* IO rows — light green tint */
    tr.io-row > td          { background: #f0faf4; }
    tr.io-row > td.col-name { color: #198754; background: #e6f6ee; }

    /* Burst bar */
    .burst-bg {
      position: absolute; top: 8px; bottom: 8px; left: 0; right: 0;
      background: #0d6efd;
      transition: filter .1s;
    }
    tr.io-row .burst-bg { background: #198754; }
    td.cell:hover .burst-bg { filter: brightness(.88); }

    .burst-bg.seg-solo   { left: 4px; right: 4px; border-radius: 5px; }
    .burst-bg.seg-start  { left: 4px; border-radius: 5px 0 0 5px; }
    .burst-bg.seg-middle { }
    .burst-bg.seg-end    { right: 4px; border-radius: 0 5px 5px 0; }

    /* ── End marker — centred on the RIGHT border (the "end instant") ── */
    .end-mark {
      position: absolute;
      right: -10px; top: 50%; transform: translateY(-50%);
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      z-index: 6; pointer-events: none; font-size: 14px;
    }
    /* END type: solid vertical bar sitting on the instant line */
    .end-vbar {
      width: 3px; height: 30px;
      background: #212529; border-radius: 1px;
    }

    /* ── Arrival marker — centred on the LEFT border (the "start instant") ── */
    .arrival-mark {
      position: absolute;
      left: -7px; top: 1px;
      width: 14px;
      text-align: center;
      font-size: 11px; font-weight: 900; line-height: 1;
      color: #212529; z-index: 7; pointer-events: none;
    }

    /* ── Queue section rows (inside same tbody) ───────────────────── */
    tr.q-divider > td {
      background: #e9ecef !important;
      border-top: 3px solid #6c757d !important;
      padding: 5px 7px;
    }
    tr.q-divider > td.col-name { background: #dde0e4 !important; }

    td.q-slot {
      vertical-align: top; padding: 2px 2px; height: 44px;
      background: #fafafa;
    }
    td.q-slot.drag-over { background: #cfe2ff !important; border-color: #0d6efd; }

    .proc-chip {
      display: block; text-align: center;
      padding: 1px 4px; margin-bottom: 2px;
      border-radius: 4px; font-size: .7rem; font-weight: 700;
      cursor: grab; user-select: none;
      background: #0d6efd; color: #fff;
    }
    .io-chip { background: #198754 !important; }
    .proc-chip:active { cursor: grabbing; }
    .proc-chip.dragging { opacity: .3; }

    select.slot-add {
      display: block; width: 100%; padding: 0 2px;
      font-size: .68rem; border: 1px solid #ced4da; border-radius: 3px;
      background: #fff; cursor: pointer; margin-top: 1px;
    }

    /* ── Context menu ─────────────────────────────────────────────── */
    #ctxMenu {
      display: none; position: fixed; z-index: 9999;
      background: #fff; border: 1px solid rgba(0,0,0,.15);
      border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.15);
      min-width: 225px; padding: 4px 0;
    }
    .ctx-hdr {
      padding: 5px 14px 3px;
      font-size: .7rem; font-weight: 700; color: #6c757d;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .ctx-item {
      padding: 6px 14px; cursor: pointer;
      display: flex; align-items: center; gap: 10px; font-size: .875rem;
    }
    .ctx-item:hover { background: #f0f2f5; }
    .ctx-item.ctx-active { background: #cfe2ff; font-weight: 600; }
    .ctx-div { border-top: 1px solid #dee2e6; margin: 3px 0; }
  </style>
</head>
<body class="py-3 px-3 px-md-4">

<!-- ── Header ──────────────────────────────────────────────────────── -->
<div class="d-flex align-items-center gap-3 mb-3">
  <h4 class="mb-0 fw-bold"><i class="bi bi-cpu-fill text-primary"></i> CPU Cycle Diagrammer</h4>
</div>

<!-- ── Controls ────────────────────────────────────────────────────── -->
<div class="card mb-3 shadow-sm">
  <div class="card-body py-2 d-flex flex-wrap gap-2 align-items-center">
    <button class="btn btn-primary btn-sm" onclick="addProcess()">
      <i class="bi bi-plus-lg"></i> Add Process
    </button>
    <button class="btn btn-outline-danger btn-sm" id="btnRmProc" onclick="removeLastProcess()" disabled>
      <i class="bi bi-dash-lg"></i> Remove Last
    </button>
    <div class="vr mx-1"></div>
    <button class="btn btn-outline-secondary btn-sm" onclick="addCycle()">
      <i class="bi bi-arrow-right-short"></i> Add Instant
    </button>
    <button class="btn btn-outline-secondary btn-sm" id="btnRmCycle" onclick="removeCycle()" disabled>
      <i class="bi bi-arrow-left-short"></i> Remove Last
    </button>
    <div class="ms-auto small text-muted d-none d-md-block">
      <i class="bi bi-info-circle"></i>
      Left-click: toggle &nbsp;·&nbsp; Right-click: end type / arrival
    </div>
  </div>
</div>

<!-- ── Diagram + Queues (single card, single table) ──────────────────── -->
<div class="card shadow-sm">
  <div class="card-header py-2 fw-semibold small d-flex align-items-center gap-3 flex-wrap">
    <span><i class="bi bi-bar-chart-steps text-primary"></i> Instruction Cycle Diagram</span>
    <span class="ms-auto d-flex gap-3 fw-normal text-muted" style="font-size:.78rem">
      <span><i class="bi bi-x-lg text-danger"></i> Syscall</span>
      <span><i class="bi bi-circle text-primary"></i> Interrupt</span>
      <span class="fw-bold" style="font-size:.82rem">| END</span>
      <span style="font-weight:900">+ Arrival</span>
    </span>
  </div>
  <div class="card-body p-2">
    <div class="tbl-wrap">
      <table class="main-tbl" id="mainTable"></table>
    </div>
  </div>
</div>

<!-- ── Context menu ─────────────────────────────────────────────────── -->
<div id="ctxMenu">
  <div class="ctx-hdr">End Type</div>
  <div class="ctx-item" id="ctx-none"      onclick="setEndType('none')">
    <i class="bi bi-square" style="width:16px"></i> None
  </div>
  <div class="ctx-item" id="ctx-syscall"   onclick="setEndType('syscall')">
    <i class="bi bi-x-lg text-danger" style="width:16px"></i> Syscall &nbsp;<small class="text-muted">(×)</small>
  </div>
  <div class="ctx-item" id="ctx-interrupt" onclick="setEndType('interrupt')">
    <i class="bi bi-circle text-primary" style="width:16px"></i> Interruption &nbsp;<small class="text-muted">(○)</small>
  </div>
  <div class="ctx-item" id="ctx-end"       onclick="setEndType('end')">
    <span style="width:16px;display:inline-block;text-align:center;font-weight:900;font-size:16px">|</span>
    END &nbsp;<small class="text-muted">(|)</small>
  </div>
  <div class="ctx-div"></div>
  <div class="ctx-item" id="ctx-arrival"   onclick="toggleArrival()">
    <span style="width:16px;display:inline-block;text-align:center;font-weight:900">+</span>
    Toggle Arrival
  </div>
  <div class="ctx-div"></div>
  <div class="ctx-item text-danger"        onclick="ctxDeactivate()">
    <i class="bi bi-eraser" style="width:16px"></i> Deactivate cell
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════════
const S = {
  processes: ['A'],       // user processes; IO-X rows are auto-generated
  cycles: 10,
  cells: {},              // "P:c" → { active, endType, arrival }
  queues: [],             // [{ id, name, slots: { c: [proc,…] } }]
};

let nextChar = 'B';
let qCounter = 0;
let ctxKey   = null;    // key of right-clicked cell
let dragSrc  = null;    // { qId, c, idx }  – for chip D&D
let dropIdx  = -1;      // insertion index during drag-over

// ═══════════════════════════════════════════════════════════════════
//  Cell helpers
// ═══════════════════════════════════════════════════════════════════
const cKey = (p, c) => `${p}:${c}`;

function getCell(p, c) {
  const k = cKey(p, c);
  if (!S.cells[k]) S.cells[k] = { active: false, endType: 'none', arrival: false };
  return S.cells[k];
}

function isActive(p, c) {
  return c >= 0 && c < S.cycles && getCell(p, c).active;
}

// ═══════════════════════════════════════════════════════════════════
//  End-type icon fragments
// ═══════════════════════════════════════════════════════════════════
const END_ICON = {
  syscall:   '<i class="bi bi-x-lg"   style="color:#dc3545;font-size:14px"></i>',
  interrupt: '<i class="bi bi-circle" style="color:#0d6efd;font-size:12px"></i>',
  end:       '<div class="end-vbar"></div>',
};

// ═══════════════════════════════════════════════════════════════════
//  Build one process or IO row
// ═══════════════════════════════════════════════════════════════════
function buildRow(name, isIO) {
  let h = `<tr${isIO ? ' class="io-row"' : ''}>`;
  h += `<td class="col-name">${name}</td>`;
  for (let c = 0; c < S.cycles; c++) {
    const cell = getCell(name, c);
    const prev = isActive(name, c - 1);
    const next = isActive(name, c + 1);

    let seg = '';
    if (cell.active) {
      if (!prev && !next) seg = 'seg-solo';
      else if (!prev)     seg = 'seg-start';
      else if (!next)     seg = 'seg-end';
      else                seg = 'seg-middle';
    }

    // End marker only on the last cell of a burst segment
    const showEnd     = cell.active && !next && cell.endType !== 'none';
    const showArrival = cell.active && cell.arrival;

    h += `<td class="cell" onclick="clickCell('${name}',${c})" oncontextmenu="rightClick(event,'${name}',${c})">`;
    if (cell.active)  h += `<div class="burst-bg ${seg}"></div>`;
    if (showArrival)  h += `<span class="arrival-mark">+</span>`;
    if (showEnd)      h += `<span class="end-mark">${END_ICON[cell.endType]}</span>`;
    h += '</td>';
  }
  h += '</tr>';
  return h;
}

// ═══════════════════════════════════════════════════════════════════
//  Build one queue row
// ═══════════════════════════════════════════════════════════════════
function buildQueueRow(q) {
  let h = '<tr>';
  h += `<td class="col-name" style="font-size:.75rem;font-weight:600">
    <div class="d-flex align-items-center gap-1">
      <span class="text-truncate flex-grow-1">${q.name}</span>
      <button class="btn btn-sm btn-outline-danger py-0 px-1"
              style="font-size:.6rem;line-height:1.3"
              onclick="removeQueue('${q.id}')">×</button>
    </div>
  </td>`;
  for (let c = 0; c < S.cycles; c++) {
    const slot = q.slots[c] || [];
    h += `<td class="q-slot" id="slot-${q.id}-${c}"
      ondragover="qDragOver(event,'${q.id}',${c})"
      ondrop="qDrop(event,'${q.id}',${c})"
      ondragleave="qDragLeave(event)">`;
    slot.forEach((pr, i) => {
      const isIO = pr.startsWith('IO-');
      h += `<span class="proc-chip${isIO ? ' io-chip' : ''}"
        draggable="true"
        ondragstart="qDragStart(event,'${q.id}',${c},${i})"
        ondragend="qDragEnd(event)"
        ondblclick="removeFromSlot('${q.id}',${c},${i})"
        title="Drag to reorder · Dbl-click to remove">${pr}</span>`;
    });
    const allProcs = S.processes.flatMap(p => [p, `IO-${p}`]);
    const opts = allProcs.map(pr => `<option value="${pr}">${pr}</option>`).join('');
    h += `<select class="slot-add" onchange="addToSlot('${q.id}',${c},this)">
      <option value="">+</option>${opts}
    </select>`;
    h += '</td>';
  }
  h += '</tr>';
  return h;
}

// ═══════════════════════════════════════════════════════════════════
//  Main render — single combined table
// ═══════════════════════════════════════════════════════════════════
function render() {
  let h = '';

  // ── THEAD: instant ruler ──
  h += '<thead><tr>';
  h += '<th class="col-name" style="border-bottom:2px solid #6c757d;vertical-align:bottom;font-size:.72rem">Process</th>';
  for (let c = 0; c < S.cycles; c++) {
    h += `<th class="col-instant">${c}</th>`;
  }
  h += '</tr></thead>';

  // ── TBODY: process rows + IO rows + queue section ──
  h += '<tbody>';

  for (const p of S.processes) {
    h += buildRow(p, false);
    h += buildRow(`IO-${p}`, true);
  }

  // Queue divider row (contains the "add queue" control)
  h += '<tr class="q-divider">';
  h += `<td class="col-name" style="font-size:.7rem;padding:5px 6px">
    <div class="fw-bold text-success mb-1" style="font-size:.75rem">
      <i class="bi bi-list-ul"></i> Queues
    </div>
    <div class="input-group input-group-sm">
      <input id="qNameInput" class="form-control" placeholder="Name…"
             style="font-size:.68rem;padding:1px 4px;min-width:0"
             onkeydown="if(event.key==='Enter')addQueue()" />
      <button class="btn btn-success btn-sm py-0 px-2"
              onclick="addQueue()"
              style="font-size:.68rem">+</button>
    </div>
  </td>`;
  for (let c = 0; c < S.cycles; c++) h += '<td></td>';
  h += '</tr>';

  // Queue rows
  for (const q of S.queues) {
    h += buildQueueRow(q);
  }

  h += '</tbody>';

  document.getElementById('mainTable').innerHTML = h;
  document.getElementById('btnRmProc').disabled  = S.processes.length <= 1;
  document.getElementById('btnRmCycle').disabled = S.cycles <= 1;
}

// ═══════════════════════════════════════════════════════════════════
//  Process / Cycle management
// ═══════════════════════════════════════════════════════════════════
function addProcess() {
  S.processes.push(nextChar);
  nextChar = String.fromCharCode(nextChar.charCodeAt(0) + 1);
  render();
}

function removeLastProcess() {
  if (S.processes.length <= 1) return;
  const removed = S.processes.pop();
  nextChar = String.fromCharCode(nextChar.charCodeAt(0) - 1);
  const ioName = `IO-${removed}`;
  for (let c = 0; c < S.cycles; c++) {
    delete S.cells[cKey(removed, c)];
    delete S.cells[cKey(ioName, c)];
  }
  S.queues.forEach(q => {
    for (let c = 0; c < S.cycles; c++) {
      if (q.slots[c]) q.slots[c] = q.slots[c].filter(pr => pr !== removed && pr !== ioName);
    }
  });
  render();
}

function addCycle() { S.cycles++; render(); }

function removeCycle() {
  if (S.cycles <= 1) return;
  S.cycles--;
  const allNames = S.processes.flatMap(p => [p, `IO-${p}`]);
  allNames.forEach(n => delete S.cells[cKey(n, S.cycles)]);
  S.queues.forEach(q => delete q.slots[S.cycles]);
  render();
}

// ═══════════════════════════════════════════════════════════════════
//  Cell interactions
// ═══════════════════════════════════════════════════════════════════
function clickCell(p, c) {
  const cell = getCell(p, c);
  cell.active = !cell.active;
  if (!cell.active) { cell.endType = 'none'; cell.arrival = false; }
  render();
}

function rightClick(e, p, c) {
  e.preventDefault();
  const cell = getCell(p, c);
  if (!cell.active) { cell.active = true; render(); }
  ctxKey = cKey(p, c);

  ['none', 'syscall', 'interrupt', 'end'].forEach(t => {
    const el = document.getElementById(`ctx-${t}`);
    if (el) el.classList.toggle('ctx-active', cell.endType === t);
  });
  const arrEl = document.getElementById('ctx-arrival');
  if (arrEl) arrEl.classList.toggle('ctx-active', !!cell.arrival);

  const menu = document.getElementById('ctxMenu');
  menu.style.display = 'block';
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(e.clientX, innerWidth  - mw - 8) + 'px';
  menu.style.top  = Math.min(e.clientY, innerHeight - mh - 8) + 'px';
}

function setEndType(t) {
  if (ctxKey && S.cells[ctxKey]) S.cells[ctxKey].endType = t;
  hideCtx(); render();
}

function toggleArrival() {
  if (ctxKey && S.cells[ctxKey]) S.cells[ctxKey].arrival = !S.cells[ctxKey].arrival;
  hideCtx(); render();
}

function ctxDeactivate() {
  if (ctxKey && S.cells[ctxKey]) {
    S.cells[ctxKey].active  = false;
    S.cells[ctxKey].endType = 'none';
    S.cells[ctxKey].arrival = false;
  }
  hideCtx(); render();
}

function hideCtx() { document.getElementById('ctxMenu').style.display = 'none'; ctxKey = null; }

document.addEventListener('click',   e => { if (!e.target.closest('#ctxMenu')) hideCtx(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtx(); });

// ═══════════════════════════════════════════════════════════════════
//  Queue management
// ═══════════════════════════════════════════════════════════════════
function addQueue() {
  const inp  = document.getElementById('qNameInput');
  const name = inp.value.trim() || `Queue ${S.queues.length + 1}`;
  S.queues.push({ id: `q${++qCounter}`, name, slots: {} });
  inp.value = '';
  render();
}

function removeQueue(id) { S.queues = S.queues.filter(q => q.id !== id); render(); }

function addToSlot(qId, c, sel) {
  if (!sel.value) return;
  const q = S.queues.find(q => q.id === qId);
  if (!q) return;
  if (!q.slots[c]) q.slots[c] = [];
  q.slots[c].push(sel.value);
  sel.value = '';
  render();
}

function removeFromSlot(qId, c, idx) {
  const q = S.queues.find(q => q.id === qId);
  if (!q?.slots[c]) return;
  q.slots[c].splice(idx, 1);
  render();
}

// ═══════════════════════════════════════════════════════════════════
//  Queue drag & drop
// ═══════════════════════════════════════════════════════════════════
function qDragStart(e, qId, c, idx) {
  dragSrc = { qId, c, idx };
  e.dataTransfer.effectAllowed = 'move';
  e.target.classList.add('dragging');
}

function qDragEnd(e) { e.target.classList.remove('dragging'); }

function qDragOver(e, tQId, tC) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const slot = e.currentTarget;
  slot.classList.add('drag-over');
  const chips = [...slot.querySelectorAll('.proc-chip')];
  dropIdx = chips.length;
  for (let i = 0; i < chips.length; i++) {
    const rect = chips[i].getBoundingClientRect();
    if (e.clientY < rect.top + rect.height / 2) { dropIdx = i; break; }
  }
}

function qDragLeave(e) { e.currentTarget.classList.remove('drag-over'); dropIdx = -1; }

function qDrop(e, tQId, tC) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragSrc) return;

  const srcQ = S.queues.find(q => q.id === dragSrc.qId);
  const tgtQ = S.queues.find(q => q.id === tQId);
  if (!srcQ || !tgtQ) { dragSrc = null; return; }

  const proc = (srcQ.slots[dragSrc.c] || [])[dragSrc.idx];
  if (proc === undefined) { dragSrc = null; return; }

  srcQ.slots[dragSrc.c].splice(dragSrc.idx, 1);
  if (!tgtQ.slots[tC]) tgtQ.slots[tC] = [];
  const insertAt = (dropIdx < 0 || dropIdx > tgtQ.slots[tC].length)
    ? tgtQ.slots[tC].length : dropIdx;
  const adj = (srcQ === tgtQ && dragSrc.c === tC && dragSrc.idx < insertAt) ? -1 : 0;
  tgtQ.slots[tC].splice(insertAt + adj, 0, proc);

  dragSrc = null; dropIdx = -1;
  render();
}

// ═══════════════════════════════════════════════════════════════════
//  Boot
// ═══════════════════════════════════════════════════════════════════
render();
</script>
</body>
</html>
